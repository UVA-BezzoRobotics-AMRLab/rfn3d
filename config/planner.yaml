# rfn3d planner parameters. Every key is optional; anything left out keeps the
# default from planner_params_t (include/rfn3d/rfn_types.h).

# --- loop / horizon ---
plan_rate: 3.0            # replanning rate (Hz)
traj_dt: 0.05             # trajectory sample period (s)
max_dist_horizon: 10.0    # receding-horizon length cap (m)
failsafe_count: 4         # consecutive failures before failsafe

# --- debug output (ZMQ planner) ---
publish_debug: true       # record map / search / corridor / stats every plan (blackbox)
debug_frame: drone_0/odom # Foxglove frame the debug output is drawn in

# --- map ---
cloud_crop: 30.0          # side of the box around the vehicle the cloud is cropped to (m)
map_resolution: 0.1       # voxel size (m)
robot_radius: 0.25        # obstacle inflation (m)
map_padding: 1.0          # free space added around the cloud's bounding box (m)
bounds_min: [-100.0, -100.0, -5.0]
bounds_max: [100.0, 100.0, 100.0]

# --- front-end ---
frontend: jps             # jps | rrt
lock_z: false             # plan only in the plane z = z_lock (forces jps)
z_lock: 1.0               # (m)
rrt_range: 2.5

# --- corridor ---
corridor_progress: 7.0
corridor_range: 5.0

# --- trajectory back-end ---
solver: gcopter           # gcopter | faster (faster needs Gurobi)
# limits: faster = hard, per axis; gcopter = penalties on |v|, body rate (w_max)
# and the thrust/tilt |a| <= a_max allows; gcopter has no jerk limit
v_max: 0.5
a_max: 3.0
j_max: 3.0
w_max: 2.0
