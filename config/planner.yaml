plan_rate: 3.0            # Hz
traj_dt: 0.05             # s
max_dist_horizon: 10.0    # m
failsafe_count: 4

publish_debug: true
debug_frame: drone_0/odom

cloud_crop: 30.0          # m
map_resolution: 0.1       # m
robot_radius: 0.25        # m
map_padding: 1.0          # m
bounds_min: [-100.0, -100.0, -5.0]
bounds_max: [100.0, 100.0, 100.0]

frontend: jps             # jps | rrt
lock_z: false             # forces jps
z_lock: 1.0               # m
rrt_range: 2.5

corridor_progress: 7.0
corridor_range: 5.0

solver: gcopter           # gcopter | faster (needs Gurobi)
v_max: 0.5
a_max: 3.0
j_max: 3.0                # faster only
w_max: 2.0
